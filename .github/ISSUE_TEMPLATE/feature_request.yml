name: Feature request
description: Suggest something Sparrow should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want, in plain words. A sample command or screen helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Server and scheduling
        - Messaging
        - Web UI
        - Board and tickets
        - Resumes and skills
        - A harness driver (Claude Code, Codex, OpenCode, new)
        - Docs
        - Other
    validations:
      required: true
