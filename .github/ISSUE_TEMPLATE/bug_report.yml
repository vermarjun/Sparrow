name: Bug report
description: Something in Sparrow does not work the way the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check [Troubleshooting](https://github.com/vermarjun/Sparrow/blob/main/docs/troubleshooting.md) first.
        Do not paste secrets. Security problems go through [SECURITY.md](https://github.com/vermarjun/Sparrow/blob/main/SECURITY.md), not a public issue.
  - type: input
    id: version
    attributes:
      label: Sparrow version
      description: Output of `sparrow --version`.
      placeholder: sparrow 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      description: For example macOS 15.3 arm64, or Ubuntu 24.04 x64.
    validations:
      required: true
  - type: input
    id: tmux
    attributes:
      label: tmux version
      description: Output of `tmux -V`.
    validations:
      required: true
  - type: textarea
    id: harnesses
    attributes:
      label: Harness versions
      description: Versions of the harnesses involved (`claude --version`, `codex --version`, `opencode --version`).
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command, or the steps from the UI.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: server.log excerpt
      description: The relevant lines from `$SPARROW_HOME/server.log` (default `~/.sparrow/server.log`). Remove anything private.
      render: text
